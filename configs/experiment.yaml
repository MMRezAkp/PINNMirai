seed: 42
battery:
  capacity_ah: 23.51
  nominal_voltage_v: 245.0
  current_positive_is: discharge
transfer:
  source_features: [voltage_v, current_a, temperature_k]
  freeze_encoder_epochs: 5
training:
  learning_rate: 0.001
  epochs: 50
validation:
  split: chronological_cycle_holdout
  metrics: [rmse, mae, max_error, soc_bound_violations]
routes:
  # Names must be unique across train and evaluation lists.
  train: [UDDS_train]
  evaluation: [WLTP_unseen, highway_unseen]
controller:
  max_fc_power_kw: 112.0
  max_battery_power_kw: 22.4
  initial_soc: 0.6
  initial_temperature_k: 298.15
sac:
  episodes: 100
  batch_size: 128
  learning_rate: 0.0005
